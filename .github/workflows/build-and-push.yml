name: Build & push image

# Roda em todo push pra main + botão manual no Actions.
# A imagem sai com 2 tags:
#   - :latest        — sempre aponta pro último build verde de main
#   - :sha-<curto>   — rastreável, usado se precisar fazer rollback no servidor
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissão pra publicar no GHCR (registry do próprio GitHub).
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/casa-roxa-gestao

jobs:
  build:
    name: Build e push pro GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
          # Garante lowercase (GHCR é case-sensitive em parte do path)
          flavor: |
            latest=false

      - name: Build e push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache do BuildKit guardado no próprio runner do GHA — builds
          # subsequentes só refazem layers que mudaram (npm ci, next build).
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Resumo
        run: |
          echo "### ✅ Build publicado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tags geradas:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No servidor, rode:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker service update --image ${{ env.IMAGE }}:latest --force casaroxa_app" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
